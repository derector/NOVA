openapi: 3.1.0
info:
  title: NOVA Core API
  version: 0.1.0
  description: "First vertical slice contract: OTP authentication, profile setup, direct chats and durable text messages."
servers:
  - url: https://api.nova.invalid
    description: Replace with the configured deployment URL; no public API is deployed yet.
paths:
  /api/v1/health:
    get:
      operationId: health
      responses:
        '200':
          description: Service health; database readiness is included by the implementation.
  /api/v1/auth/request-code:
    post:
      operationId: requestEmailCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 320}
      responses:
        '202': {description: Code request accepted without exposing account enumeration}
        '400': {description: Invalid input}
        '429': {description: Rate limit reached}
        '503': {description: Email delivery is not configured or temporarily unavailable}
  /api/v1/auth/verify-code:
    post:
      operationId: verifyEmailCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: {type: string, format: email, maxLength: 320}
                code: {type: string, minLength: 6, maxLength: 12}
      responses:
        '200':
          description: Code accepted; short-lived access token and refresh token returned once.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, accessTokenExpiresAt, refreshToken, user]
                properties:
                  accessToken: {type: string}
                  accessTokenExpiresAt: {type: string, format: date-time}
                  refreshToken: {type: string}
                  user: {$ref: '#/components/schemas/User'}
        '400': {description: Invalid, expired or already-used code}
        '429': {description: Rate limit reached}
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: {type: string}
      responses:
        '200':
          description: Rotated access and refresh tokens.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, accessTokenExpiresAt, refreshToken, user]
                properties:
                  accessToken: {type: string}
                  accessTokenExpiresAt: {type: string, format: date-time}
                  refreshToken: {type: string}
                  user: {$ref: '#/components/schemas/User'}
        '401': {description: Invalid, expired or revoked refresh token}
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Current refresh session revoked}
        '401': {description: Missing or invalid access token}
  /api/v1/users/me:
    get:
      operationId: getMe
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Authenticated user's private profile, including their own email.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {description: Missing or invalid access token}
    patch:
      operationId: updateMe
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: {type: string, minLength: 3, maxLength: 32, pattern: '^[A-Za-z0-9_]+$'}
                displayName: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200': {description: Updated private profile, including the account owner's email, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '409': {description: Username is already taken}
        '401': {description: Missing or invalid access token}
  /api/v1/users/search:
    get:
      operationId: searchUsers
      security: [{bearerAuth: []}]
      parameters:
        - {name: username, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 32}}
      responses:
        '200':
          description: Public user results; email addresses are never returned.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PublicUser'}
  /api/v1/chats:
    get:
      operationId: listChats
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Chats visible to current user; participant email addresses are private.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Chat'}
  /api/v1/chats/direct:
    post:
      operationId: createDirectChat
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: {type: string, format: uuid}
      responses:
        '200':
          description: Existing or newly-created direct chat.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Chat'}
        '403': {description: Chat creation is not allowed}
  /api/v1/chats/{chatId}/messages:
    get:
      operationId: listMessages
      security: [{bearerAuth: []}]
      parameters:
        - {name: chatId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: after, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Authorized messages after cursor; use nextCursor for catch-up.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Message'}}
                  nextCursor: {type: [string, 'null'], format: uuid}
        '403': {description: User cannot access this chat}
    post:
      operationId: createMessage
      security: [{bearerAuth: []}]
      parameters:
        - {name: chatId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string, minLength: 1, maxLength: 10000}
      responses:
        '201':
          description: Server-confirmed durable message (or prior message with same idempotency key).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '403': {description: User cannot send to this chat}
        '409': {description: Idempotency key reused with different content}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      description: Private profile; email is returned only to the authenticated account owner.
      required: [id, email, username, displayName]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        username: {type: string}
        displayName: {type: string}
    PublicUser:
      type: object
      description: Public profile fields; does not contain the account email.
      required: [id, username, displayName]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        displayName: {type: string}
    Chat:
      type: object
      required: [id, participant, updatedAt]
      properties:
        id: {type: string, format: uuid}
        participant: {$ref: '#/components/schemas/PublicUser'}
        updatedAt: {type: string, format: date-time}
    Message:
      type: object
      required: [id, clientMessageId, chatId, senderId, text, createdAt]
      properties:
        id: {type: string, format: uuid}
        clientMessageId: {type: string, format: uuid}
        chatId: {type: string, format: uuid}
        senderId: {type: string, format: uuid}
        text: {type: string}
        createdAt: {type: string, format: date-time}
        deliveredAt: {type: [string, 'null'], format: date-time}
