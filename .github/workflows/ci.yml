name: NOVA CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend / PostgreSQL / tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgres://nova:nova@127.0.0.1:5432/nova
      APP_SECRET: ci-only-not-for-deployment-nova-test-secret
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 30
      OTP_TTL_MINUTES: 10
      OTP_MAX_ATTEMPTS: 5
      CORS_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test
      - name: Apply PostgreSQL migrations
        run: npm run migrate
      - name: Build and audit
        run: |
          npm run build
          npm audit --audit-level=high
      - name: Start API and check database-backed health
        run: |
          npm run start > "$RUNNER_TEMP/nova-backend.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/health; then
              printf '\n'
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/nova-backend.log"
          exit 1

      - name: Build API deployment container
        run: docker build -t nova-api:ci .

  web:
    name: Web / lint / typecheck / build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_NOVA_API_BASE_URL: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, typecheck, build and audit
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm audit --audit-level=moderate

  download:
    name: Download site / manifest tests / build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: download
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test and build
        run: |
          npm test
          npm run build

  android-debug:
    name: Android / native debug APK and unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install required Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK and run JVM unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nova-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-release:
    name: Android / signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    env:
      NOVA_API_BASE_URL: ${{ vars.NOVA_API_BASE_URL }}
      NOVA_UPDATE_MANIFEST_URL: ${{ vars.NOVA_UPDATE_MANIFEST_URL }}
      NOVA_APK_PUBLIC_BASE_URL: ${{ vars.NOVA_APK_PUBLIC_BASE_URL }}
      NOVA_RELEASE_CERT_SHA256: ${{ vars.NOVA_RELEASE_CERT_SHA256 }}
      NOVA_MINIMUM_VERSION_CODE: ${{ vars.NOVA_MINIMUM_VERSION_CODE }}
      NOVA_RELEASE_KEY_BASE64: ${{ secrets.NOVA_RELEASE_KEY_BASE64 }}
      NOVA_RELEASE_STORE_PASSWORD: ${{ secrets.NOVA_RELEASE_STORE_PASSWORD }}
      NOVA_RELEASE_KEY_ALIAS: ${{ secrets.NOVA_RELEASE_KEY_ALIAS }}
      NOVA_RELEASE_KEY_PASSWORD: ${{ secrets.NOVA_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install required Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate release secrets and materialize temporary keystore
        shell: bash
        run: |
          set -euo pipefail
          NOVA_RELEASE_STORE_FILE="$RUNNER_TEMP/nova-release.jks"
          printf 'NOVA_RELEASE_STORE_FILE=%s\n' "$NOVA_RELEASE_STORE_FILE" >> "$GITHUB_ENV"
          test -n "$NOVA_RELEASE_KEY_BASE64" || { echo 'Missing release environment secret NOVA_RELEASE_KEY_BASE64'; exit 1; }
          test -n "$NOVA_RELEASE_STORE_PASSWORD" || { echo 'Missing release environment secret NOVA_RELEASE_STORE_PASSWORD'; exit 1; }
          test -n "$NOVA_RELEASE_KEY_ALIAS" || { echo 'Missing release environment secret NOVA_RELEASE_KEY_ALIAS'; exit 1; }
          test -n "$NOVA_RELEASE_KEY_PASSWORD" || { echo 'Missing release environment secret NOVA_RELEASE_KEY_PASSWORD'; exit 1; }
          case "$NOVA_API_BASE_URL" in https://*) ;; *) echo 'Set the release environment variable NOVA_API_BASE_URL to a public HTTPS API URL'; exit 1;; esac
          case "$NOVA_UPDATE_MANIFEST_URL" in https://*) ;; *) echo 'Set NOVA_UPDATE_MANIFEST_URL to the public HTTPS update manifest URL'; exit 1;; esac
          printf '%s' "$NOVA_RELEASE_KEY_BASE64" | base64 --decode > "$NOVA_RELEASE_STORE_FILE"
          chmod 600 "$NOVA_RELEASE_STORE_FILE"
      - name: Assemble signed release APK
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify APK and create the update manifest
        shell: bash
        run: |
          python3 scripts/prepare-release.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --tag "$GITHUB_REF_NAME" \
            --signer-sha256 "$NOVA_RELEASE_CERT_SHA256" \
            --apk-base-url "$NOVA_APK_PUBLIC_BASE_URL" \
            --minimum-version-code "${NOVA_MINIMUM_VERSION_CODE:-0}" \
            --output app/build/nova-release
      - name: Upload signed release APK and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nova-release-apk
          path: android/app/build/nova-release/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$NOVA_RELEASE_STORE_FILE"
